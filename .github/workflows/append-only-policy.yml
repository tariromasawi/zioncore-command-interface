name: Append-only release policy

on:
  pull_request_target:
    branches: [release/command-public-rebuild]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing candidate pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve-candidate:
    name: resolve-candidate
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Resolve the candidate pull request
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.eventName === "workflow_dispatch"
              ? Number(context.payload.inputs.pr_number)
              : Number(context.payload.pull_request.number);
            if (!Number.isSafeInteger(number) || number < 1) {
              throw new Error("A valid candidate pull request number is required.");
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            if (pr.base.ref !== "release/command-public-rebuild") {
              throw new Error("Candidate pull requests must target release/command-public-rebuild.");
            }
            if (pr.head.repo?.full_name.toLowerCase() !== context.repo.repo.toLowerCase()
                && pr.head.repo?.full_name.toLowerCase() !== `${context.repo.owner}/${context.repo.repo}`.toLowerCase()) {
              throw new Error("Candidate branches must be in the protected project repository.");
            }
            core.setOutput("pr_number", String(number));
            core.setOutput("base_sha", pr.base.sha);
            core.setOutput("head_sha", pr.head.sha);

  check-append-only-policy:
    name: check-append-only-policy
    needs: resolve-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-candidate.outputs.base_sha }}
          fetch-depth: 0
      - name: Fetch candidate commit without executing it
        env:
          PR_NUMBER: ${{ needs.resolve-candidate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve-candidate.outputs.head_sha }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head:refs/remotes/pull/$PR_NUMBER"
          [[ "$(git rev-parse "refs/remotes/pull/$PR_NUMBER")" == "$HEAD_SHA" ]]
      - name: Verify immutable baseline, Seed, paths, and release manifest
        env:
          BASE_SHA: ${{ needs.resolve-candidate.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve-candidate.outputs.head_sha }}
        run: node ops/append-only-check.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Test trusted policy and release composer
        run: node --test ops/append-only-check.test.mjs ops/compose-versioned-release.test.mjs

  test-candidate:
    name: test-candidate
    needs: resolve-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-candidate.outputs.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api-server run test
        env:
          COMMAND_GENESIS_TEST_SEED_PATH: ${{ github.workspace }}/Genesis seed.ts
      - name: Check trusted scripts and compose the candidate release
        env:
          HEAD_SHA: ${{ needs.resolve-candidate.outputs.head_sha }}
        run: |
          bash -n ops/cloud.sh
          bash -n ops/prepare-genesis-seed.sh
          bash -n ops/prepare-cloudbuild-research.sh
          bash -n ops/deploy-research-job.sh
          bash -n ops/verify-research-image.sh
          node --test ops/append-only-check.test.mjs ops/compose-versioned-release.test.mjs
          node ops/compose-versioned-release.mjs \
            --manifest latest \
            --output "$GITHUB_WORKSPACE/.composed-release" \
            --source-commit "$HEAD_SHA"
      - name: Build candidate image without deployment credentials
        run: docker build -t zioncore-command:candidate "$GITHUB_WORKSPACE/.composed-release"
      - name: Remove the temporary composed build tree
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/.composed-release"

  publish-required-check:
    name: publish-required-check
    if: always() && needs.resolve-candidate.result == 'success'
    needs: [resolve-candidate, check-append-only-policy, test-candidate]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
    steps:
      - name: Record the required result on the candidate commit
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.resolve-candidate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve-candidate.outputs.head_sha }}
          POLICY_RESULT: ${{ needs.check-append-only-policy.result }}
          TEST_RESULT: ${{ needs.test-candidate.result }}
        with:
          script: |
            const conclusion = process.env.POLICY_RESULT === "success"
              && process.env.TEST_RESULT === "success"
              ? "success"
              : "failure";
            const details = [
              `Append-only policy: ${process.env.POLICY_RESULT}`,
              `Candidate tests: ${process.env.TEST_RESULT}`,
            ].join("\n");
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "ZionCore append-only release",
              head_sha: process.env.HEAD_SHA,
              status: "completed",
              conclusion,
              output: {
                title: conclusion === "success" ? "Candidate passed" : "Candidate rejected",
                summary: details,
              },
              external_id: `zioncore-pr-${process.env.PR_NUMBER}-${process.env.HEAD_SHA}`,
            });
