name: Command checks
on:
  pull_request:
  push:
    branches: [main, release/command-public-rebuild]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api-server run test
        env:
          COMMAND_GENESIS_TEST_SEED_PATH: ${{ github.workspace }}/Genesis seed.ts
      - run: bash -n ops/cloud.sh
      - run: bash -n ops/prepare-genesis-seed.sh
      - run: docker build -t zioncore-command:ci .
      - name: Check the approved Seed read-only mount with AI disabled
        run: |
          seed_mount="$(mktemp -d)"
          trap 'rm -rf "$seed_mount"' EXIT
          mkdir -p "$seed_mount/approved/1.1.0"
          cp "Genesis seed.ts" "$seed_mount/approved/1.1.0/genesis-seed.ts"
          docker run --rm \
            --mount "type=bind,source=$seed_mount,target=/mnt/genesis,readonly" \
            -e NODE_ENV=production \
            -e COMMAND_GENESIS_PATH=/mnt/genesis/approved/1.1.0/genesis-seed.ts \
            -e COMMAND_GENESIS_VERSION=1.1.0 \
            -e COMMAND_GENESIS_SHA256=8199eb2b080c6ac56f71443c1506173f8227dc9df58a145801b56e9e2fd538c6 \
            -e COMMAND_ENABLE_GENESIS_AI=0 \
            -e COMMAND_ENABLE_DAILY_GENESIS=0 \
            -e COMMAND_ENABLE_PAID_AI=0 \
            -e COMMAND_PAID_AI_MONTHLY_CAP_MICROS=0 \
            zioncore-command:ci node dist/jobMain.mjs seed-check
          if docker run --rm \
            --mount "type=bind,source=$seed_mount,target=/mnt/genesis,readonly" \
            -e NODE_ENV=production \
            -e COMMAND_GENESIS_PATH=/mnt/genesis/approved/1.1.0/genesis-seed.ts \
            -e COMMAND_GENESIS_VERSION=1.1.0 \
            -e COMMAND_GENESIS_SHA256=ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff \
            -e COMMAND_ENABLE_GENESIS_AI=0 \
            -e COMMAND_ENABLE_DAILY_GENESIS=0 \
            -e COMMAND_ENABLE_PAID_AI=0 \
            -e COMMAND_PAID_AI_MONTHLY_CAP_MICROS=0 \
            zioncore-command:ci node dist/jobMain.mjs seed-check; then
            echo "Seed check accepted a mismatched checksum" >&2
            exit 1
          fi
      - name: Check image entry points
        run: |
          docker volume create command-ci-state
          docker run --rm --user 0 -v command-ci-state:/state zioncore-command:ci chown node:node /state
          docker run --rm -v command-ci-state:/state -e NODE_ENV=development -e COMMAND_SQLITE_PATH=/state/command.sqlite zioncore-command:ci node dist/jobMain.mjs archive-exercise
          docker run --rm -v command-ci-state:/state -e NODE_ENV=development -e COMMAND_SQLITE_PATH=/state/command.sqlite zioncore-command:ci node dist/command/knowledgeMain.mjs export /state/knowledge.json
          docker run --rm -v command-ci-state:/state -e NODE_ENV=development -e COMMAND_STORE=sqlite -e COMMAND_SQLITE_PATH=/state/restored.sqlite -e COMMAND_KNOWLEDGE_RESTORE=1 zioncore-command:ci node dist/command/knowledgeMain.mjs restore /state/knowledge.json
          docker run --rm -v command-ci-state:/state -e NODE_ENV=development -e COMMAND_STORE=sqlite -e COMMAND_SQLITE_PATH=/state/restored.sqlite zioncore-command:ci node dist/command/knowledgeMain.mjs verify /state/knowledge.json
          id=$(docker run -d -v command-ci-state:/state -p 127.0.0.1:8080:8080 -e NODE_ENV=development -e COMMAND_SQLITE_PATH=/state/command.sqlite zioncore-command:ci)
          trap 'docker logs "$id"; docker rm -f "$id"; docker volume rm command-ci-state' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/api/healthz
          curl --fail http://127.0.0.1:8080/api/command/feed | jq -e '(.engines | length == 14) and (.runs[0].id == "archive-exercise-v1") and (.knowledge | length == 2)'
          curl --fail http://127.0.0.1:8080/api/command/knowledge/export | jq -e '.format == "zioncore-command-knowledge" and .entryCount == 2'
          curl --fail http://127.0.0.1:8080/engines/high-freq-purification
          curl --fail http://127.0.0.1:8080/knowledge
  cloud-access-check:
    if: github.repository == 'tariromasawi/zioncore-command-interface' && github.ref == 'refs/heads/release/command-public-rebuild'
    environment: command-production
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Confirm requested Google identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Requested Google identity: command-release@gen-lang-client-0266144152.iam.gserviceaccount.com"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/740460863819/locations/global/workloadIdentityPools/command-github/providers/command-release
          service_account: command-release@gen-lang-client-0266144152.iam.gserviceaccount.com
          project_id: gen-lang-client-0266144152
      - uses: google-github-actions/setup-gcloud@v2
      - name: Verify read-only Google Cloud access
        run: |
          identity="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          echo "Authenticated Google identity: $identity"
          test "$identity" = "command-release@gen-lang-client-0266144152.iam.gserviceaccount.com"
          bash ops/cloud.sh inventory
