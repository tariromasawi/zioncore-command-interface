name: Read-only ZionCore research job diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  describe-research-job:
    if: github.repository == 'tariromasawi/zioncore-command-interface' && github.ref == 'refs/heads/release/command-public-rebuild'
    environment: command-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Confirm the selected release branch
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = "tariromasawi/zioncore-command-interface"
          test "$GITHUB_REF" = "refs/heads/release/command-public-rebuild"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/740460863819/locations/global/workloadIdentityPools/command-github/providers/command-release
          service_account: command-release@gen-lang-client-0266144152.iam.gserviceaccount.com
          project_id: gen-lang-client-0266144152
      - uses: google-github-actions/setup-gcloud@v2
      - name: Describe the research job and runtime service account
        run: |
          identity="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          echo "Authenticated identity: $identity"
          test "$identity" = "command-release@gen-lang-client-0266144152.iam.gserviceaccount.com"
          job_json="$(gcloud run jobs describe zioncore-command-research \
            --project=gen-lang-client-0266144152 --region=europe-west2 --format=json)"
          printf '%s\n' "$job_json" |
            jq -e '.metadata.name == "zioncore-command-research"' >/dev/null
          printf '%s\n' "$job_json" |
            jq '{name:.metadata.name, generation:.metadata.generation, runtimeServiceAccount:(.template.template.serviceAccount // "unset")}'
